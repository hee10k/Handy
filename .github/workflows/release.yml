name: "Release Tajagi (unsigned)"

# Build the green unsigned matrix and turn it into a GitHub Release. This is
# the fork's release path: macOS is excluded (built locally — see
# main-build.yml), and everything is unsigned because the fork holds no
# code-signing secrets. Each installable is attached to a v<version> release.
# Run manually; version defaults to src-tauri/tauri.conf.json.

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Release version (e.g. 0.10.0). Empty = read "version" from
          src-tauri/tauri.conf.json.
        required: false
        type: string

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
            args: "--bundles deb"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04"
            args: "--bundles appimage,rpm"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04-arm"
            args: "--bundles appimage,deb,rpm"
            target: "aarch64-unknown-linux-gnu"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"
          - platform: "windows-11-arm"
            args: "--target aarch64-pc-windows-msvc"
            target: "aarch64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      upload-artifacts: true
      sign-binaries: false
      # Releases always build from scratch — never restore the Rust cache, so
      # a stale cached native lib can never be linked into a shipped artifact.
      no-cache: true
    secrets: inherit

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing Tajagi v$VERSION"

      - name: Download installers
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create \
            "v${{ steps.version.outputs.version }}" \
            --title "Tajagi v${{ steps.version.outputs.version }}" \
            --notes "Unsigned Tajagi build (Windows + Linux). macOS is built locally." \
            --generate-notes \
            --repo "${{ github.repository }}"

      - name: Upload installers as release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload \
            "v${{ steps.version.outputs.version }}" \
            release-assets/* \
            --repo "${{ github.repository }}" \
            --clobber