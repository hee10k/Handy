name: "Main Branch Build"

# Tajagi fork build. Upstream's build.yml signs releases via secrets (Apple,
# Azure trusted-signing, updater key) that this fork does not have. The fork
# sets sign-binaries: false and its tauri.conf.json builds unsigned
# (createUpdaterArtifacts: false, no windows.signCommand), so every push to
# main / tajagi produces plain unsigned installers on the full platform
# matrix — including Windows, which is the 5x paste-matrix test target.
# Artifacts are kept 30 days.

on:
  push:
    branches: [main, tajagi]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-26"
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: "--bundles deb"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04"
            args: "--bundles appimage,rpm"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04-arm"
            args: "--bundles appimage,deb,rpm"
            target: "aarch64-unknown-linux-gnu"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"
          - platform: "windows-11-arm"
            args: "--target aarch64-pc-windows-msvc"
            target: "aarch64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      upload-artifacts: true
      # Fork has no code-signing secrets; build unsigned (see tauri.conf.json).
      sign-binaries: false
    secrets: inherit