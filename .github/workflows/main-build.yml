name: "Main Branch Build"

# Tajagi fork build. Upstream's released/app signed via build.yml + secrets
# (Apple, Azure trusted-signing, updater key) that this fork does not have, so
# the fork cannot run that pipeline. Instead build the platforms we test on —
# Windows (5x paste matrix) and macOS — as plain *unsigned* test builds on
# every push to main / tajagi. Artifacts are kept 30 days.
#
# No signing environment is set at all: tauri.conf.json is configured to build
# without updater artifacts / signCommand (see bundle.createUpdaterArtifacts),
# so these produce clean unsigned installers.

on:
  push:
    branches: [main, tajagi]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target: ""
            artifact-name: "tajagi-macos"
          - platform: "windows-latest"
            target: ""
            artifact-name: "tajagi-windows"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (unsigned test bundle)
        shell: bash
        run: |
          bun run tauri build --target "${{ matrix.target }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: warn